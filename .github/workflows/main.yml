# Bible data source

Young Minds Bible is configured to bundle the **King James Version (KJV)** locally for offline reading.

Build-time source: Midvash `bible-data` KJV 1769 corpus. The source repository identifies this KJV edition as public domain and provides a 66-book Protestant canon in JSON/SQLite formats.

The app's `tool/fetch_full_bible.py` fetches and normalises the corpus **before compilation**. `tool/verify_full_bible.py` refuses a production build unless the local asset contains 66 books, 1,189 chapters, more than 31,000 non-empty verses, and valid verse text.

The finished APK/AAB contains the resulting `assets/data/kjv.json`; end users therefore do not need internet to read, search, bookmark, highlight, or make notes.

# Build the Android APK and AAB with GitHub Actions

This repository is a Flutter app. GitHub may label the repository language as **Dart**; that is normal.

## Upload
Upload the extracted project contents to the repository root. The Code tab should show at least:

- `.github/workflows/build-android.yml`
- `lib/`
- `assets/`
- `tool/`
- `pubspec.yaml`

Do not upload only the ZIP file.

## Build
1. Open the repository on GitHub.
2. Select **Actions**.
3. Select **Build Young Minds Bible Android**.
4. Click **Run workflow** and choose `main`.
5. When the run finishes successfully, open it and scroll to **Artifacts**.
6. Download `young-minds-bible-apk` to get `app-release.apk` for Android phone testing.
7. Download `young-minds-bible-aab` to get `app-release.aab` for the Google Play release pipeline.

The workflow recreates the Android host using the same stable Flutter SDK that performs the build, fetches and validates the complete offline KJV corpus, runs `flutter analyze` and `flutter test`, then produces both Android artifacts.

## Important Play Store note
The generated AAB is a release build for build/testing purposes. Before final Google Play publication, configure your permanent upload signing key and Play Console app-signing setup. Never commit keystore passwords or key files to GitHub.

# Why GitHub says Dart

Young Minds Bible is a Flutter application. Flutter app source is primarily written in Dart, so GitHub Linguist normally reports **Dart** as the repository language. GitHub does not use a separate “Flutter” programming-language label.

The Android host project is under `android/`. The release workflow is `.github/workflows/build-android.yml`.

A valid repository root should contain `pubspec.yaml`, `lib/`, `android/`, `.github/`, `assets/`, and `test/`.

