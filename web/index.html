<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Young Minds Bible — read, search, bookmark, take notes and grow in God's Word.">
  <meta name="theme-color" content="#0B3B82">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Young Minds Bible">
  <meta name="mobile-web-app-capable" content="yes">

  <meta property="og:title" content="Young Minds Bible">
  <meta property="og:description" content="Read • Learn • Grow • Live God's Word">
  <meta property="og:type" content="website">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Young Minds Bible</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff8e8;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    #startup {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: radial-gradient(circle at top, #ffffff 0%, #fff8e8 50%, #e7f0ff 100%);
      z-index: 9999;
      transition: opacity .25s ease;
    }
    .startup-card {
      width: min(430px, 92vw);
      text-align: center;
    }
    .startup-logo {
      width: min(280px, 72vw);
      height: auto;
      border-radius: 24px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.14));
    }
    .startup-title {
      margin: 18px 0 4px;
      color: #0b3b82;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.05;
      font-weight: 800;
    }
    .startup-tagline {
      margin: 0 0 20px;
      color: #81520b;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .4px;
    }
    .loader {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border: 4px solid rgba(11,59,130,.18);
      border-top-color: #0b3b82;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .noscript {
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #102a43;
    }
  </style>
</head>
<body>
  <div id="startup" aria-label="Young Minds Bible is loading">
    <div class="startup-card">
      <img class="startup-logo" src="icons/Icon-512.png" alt="PastorAbayomi Bible Stories logo">
      <div class="startup-title">Young Minds Bible</div>
      <div class="startup-tagline">READ • LEARN • GROW • LIVE GOD'S WORD</div>
      <div class="loader" aria-hidden="true"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">Young Minds Bible requires JavaScript to run in your browser.</div>
  </noscript>

  <script>
    // Remove the HTML splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      const startup = document.getElementById('startup');
      if (!startup) return;
      startup.style.opacity = '0';
      setTimeout(() => startup.remove(), 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
